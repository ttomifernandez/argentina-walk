<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Argentina Shooter — Estadio en Primera Persona</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <div id="overlay">
    <div class="flag">🇦🇷</div>
    <h1>ARGENTINA SHOOTER</h1>
    <p class="tagline">Eliminá a los de amarillo</p>
    <button id="startBtn">▶&nbsp; ENTRAR Y DISPARAR</button>
    <div class="controls-grid">
      <div class="ctrl"><kbd>↑ ↓ ← →</kbd><span>Caminar</span></div>
      <div class="ctrl"><kbd>ESPACIO</kbd><span>Saltar</span></div>
      <div class="ctrl"><kbd>MOUSE</kbd><span>Apuntar</span></div>
      <div class="ctrl"><kbd>CLICK</kbd><span>Disparar</span></div>
    </div>
  </div>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="hint">CLICK para disparar · ESC pausar</div>
    <div id="paused-msg">PAUSADO — Click para continuar</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
